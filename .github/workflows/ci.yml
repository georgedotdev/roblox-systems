name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Lint, format, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain (Rokit)
        uses: CompeyDev/setup-rokit@v0.2.1

      - name: Check formatting (StyLua)
        run: stylua --check src tests

      - name: Lint (selene)
        run: selene src tests

      - name: Unit tests (Lune)
        run: lune run tests/run

      - name: Build place file (Rojo)
        run: |
          wally install
          rojo build default.project.json --output build.rbxl
